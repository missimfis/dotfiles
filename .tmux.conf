# Minimal Fast Tmux Config

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Fast
set -sg escape-time 0
set -sg repeat-time 200

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse
set -g mouse on

# History
set -g history-limit 10000

# Vim navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Status - Nord theme with black background
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style bg=black,fg="#D8DEE9"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style fg="#88C0D0",bg=black
set -g pane-border-style fg="#4C566A",bg=black
set -g pane-active-border-style fg="#88C0D0",bg=black
set -g message-style fg="#D8DEE9",bg=black
set -g message-command-style fg="#D8DEE9",bg=black
set -g status-left-length 60
set -g status-right-length 60

# Clipboard
set -g set-clipboard on

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
