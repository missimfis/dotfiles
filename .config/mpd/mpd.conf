music_directory		"/home/lion/Musik"
playlist_directory	"/home/lion/.config/mpd/playlists"
db_file			"/home/lion/.config/mpd/mpd.db"
state_file		"/home/lion/.config/mpd/mpdstate"

auto_update "yes"
bind_to_address "127.0.0.1"
restore_paused "yes"
max_output_buffer_size "16384"

audio_output {
        type            "alsa"
        name            "ALSA Output"
        device          "default"
}

audio_output {
       type	"fifo"
       name	"Visualizer feed"
       path	"/tmp/mpd.fifo"
       format	"44100:16:2"
}
